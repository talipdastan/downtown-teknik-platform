name: Release Mobile APK (Signed + Split ABI + GitHub Releases)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ornek: v1.3.0)"
        required: true
      shorebird_patch:
        description: "Yalnizca Shorebird OTA yamasi gonder (APK derlemeden)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Publish Signed Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required secrets
        shell: bash
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Eksik GitHub Secret: $var"
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configure release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Flutter pub get & tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Shorebird OTA Patch (Optional)
        if: ${{ inputs.shorebird_patch == true }}
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL || 'http://10.16.19.19' }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::warning::SHOREBIRD_TOKEN tanimli degil; Shorebird OTA yamasi atlandi."
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
          "$HOME/.shorebird/bin/shorebird" patch android \
            -- --dart-define=SUPABASE_URL="$SUPABASE_URL" \
               --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
               --dart-define=UPDATE_SERVER_URL="$UPDATE_SERVER_URL"

      - name: Build Split-per-ABI Release APKs (~21 MB) & Universal Fallback
        if: ${{ inputs.shorebird_patch != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL || 'http://10.16.19.19' }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=UPDATE_SERVER_URL="$UPDATE_SERVER_URL"

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=UPDATE_SERVER_URL="$UPDATE_SERVER_URL"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/downtown-teknik-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/downtown-teknik-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/downtown-teknik.apk
          ls -lh dist/

      - name: Publish APKs to GitHub Releases
        if: ${{ inputs.shorebird_patch != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/mobile/dist/downtown-teknik-arm64-v8a.apk
            apps/mobile/dist/downtown-teknik-armeabi-v7a.apk
            apps/mobile/dist/downtown-teknik.apk

      - name: Cleanup keystore files
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties
