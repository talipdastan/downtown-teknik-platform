name: avm_tech_platform
description: "Downtown Teknik – Teknik Operasyon Yönetim Platformu (Mobil)"
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend & Auth
  supabase_flutter: ^2.8.0

  # Medya ve Bildirimler
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Enerji Modülü Araçları
  excel: ^4.0.6
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/downtown_teknik_logo.png
    - assets/branding/downtown_teknik_icon.png
